<title>Výběr dnů do kalendáře</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one checklist page. Groups of days with their own select-all, a sticky summary bar with the copy button. */
:root {
  --bg: #edf1f6; --card: #f8fafd; --line: rgba(21,32,43,.12); --text: #15202b; --dim: rgba(21,32,43,.68);
  --accent: #2b7287; --accent-bg: rgba(43,114,135,.14); --on-accent: #f4fafc;
  --font: 'Figtree', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1319; --card: #18202b; --line: rgba(230,234,242,.12); --text: #e6eaf2; --dim: rgba(230,234,242,.68);
  --accent: #78b4c4; --accent-bg: rgba(120,180,196,.18); --on-accent: #08131a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1319; --card: #18202b; --line: rgba(230,234,242,.12); --text: #e6eaf2; --dim: rgba(230,234,242,.68);
  --accent: #78b4c4; --accent-bg: rgba(120,180,196,.18); --on-accent: #08131a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 40px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1 { margin: 0; font-size: clamp(28px, 6vw, 38px); letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
h2 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
p { margin: 0; color: var(--dim); max-width: 62ch; }
.lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--dim); }
.group { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 6px 6px; display: flex; flex-direction: column; gap: 4px; }
.gh { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 0 12px 6px; }
.gh .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gh small { color: var(--dim); font-size: 13px; }
.mini { display: inline-flex; gap: 6px; }
.mini button { font: inherit; font-size: 13px; font-weight: 600; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: none; color: var(--text); cursor: pointer; }
.item { display: grid; grid-template-columns: 24px 74px 1fr; gap: 10px; align-items: center; padding: 8px 12px; min-height: 44px; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-of-type { border-top: 0; }
.item input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
.item .d { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.item .n { min-width: 0; }
.item .n small { display: block; color: var(--dim); font-size: 12.5px; }
.item:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }
.bar { position: sticky; bottom: 0; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between;
  margin-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 8px 30px rgba(0,0,0,.18); }
.bar .c { font-weight: 600; }
.btn { font: inherit; font-weight: 700; font-size: 14px; min-height: 44px; padding: 0 18px; border-radius: 12px; cursor: pointer; border: 1px solid var(--line); background: none; color: var(--text); }
.btn.p { background: var(--accent); color: var(--on-accent); border-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
pre { margin: 0; white-space: pre-wrap; font: 13px/1.55 ui-monospace, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; max-height: 360px; overflow: auto; }
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <span class="lbl">Questlog · kalendář</span>
    <h1>Které dny dát do kalendáře</h1>
    <p>Zaškrtnuté dny se při prvním spuštění vloží do kalendáře jako události, které se každý rok opakují. Státní svátky (13) tam budou vždy. Tady vybíráš jen významné a lidové dny. Dole klikni na „Zkopírovat výběr“ a vlož ho do chatu.</p>
  </header>
  <div id="groups" style="display:flex;flex-direction:column;gap:20px"></div>
  <section style="display:flex;flex-direction:column;gap:10px" aria-label="Náhled výběru">
    <span class="lbl">Co se zkopíruje</span>
    <pre id="out" aria-live="polite"></pre>
  </section>
  <div class="bar">
    <span class="c" id="count"></span>
    <span class="mini"><button class="btn" type="button" id="clear">Vymazat</button><button class="btn p" type="button" id="copy">Zkopírovat výběr</button></span>
  </div>
</div>

<script>
(function () {
  var G = [
    { id: 'law', title: 'Významné dny', sub: '20 dní podle zákona 245/2000 Sb. Pracovní dny, jen připomínky.', items: [
      ['16. 1.', 'Den památky Jana Palacha'], ['27. 1.', 'Den památky obětí holocaustu a předcházení zločinům proti lidskosti'],
      ['8. 3.', 'Mezinárodní den žen'], ['9. 3.', 'Den památky obětí vyhlazení terezínského rodinného tábora v Osvětimi-Březince'],
      ['12. 3.', 'Den přístupu ČR k NATO'], ['28. 3.', 'Den narození Jana Ámose Komenského'], ['30. 3.', 'Den české vlajky', 'poprvé 2027'],
      ['7. 4.', 'Den vzdělanosti'], ['1. 5.', 'Den přistoupení ČR k Evropské unii'], ['5. 5.', 'Květnové povstání českého lidu'],
      ['15. 5.', 'Den rodin'], ['27. 5.', 'Den národního vzdoru'], ['10. 6.', 'Den památky obětí vyhlazení obce Lidice'],
      ['18. 6.', 'Den hrdinů druhého odboje'], ['25. 6.', 'Den odchodu okupačních vojsk'], ['27. 6.', 'Den památky obětí komunistického režimu'],
      ['21. 8.', 'Den památky obětí invaze a okupace vojsky Varšavské smlouvy'], ['8. 10.', 'Památný den sokolstva'], ['12. 10.', 'Den samizdatu'],
      ['11. 11.', 'Den válečných veteránů']
    ] },
    { id: 'fixed', title: 'Lidové dny, pevné datum', sub: 'Můj návrh. V zákoně nejsou.', items: [
      ['14. 2.', 'Valentýn'], ['1. 4.', 'Apríl'], ['22. 4.', 'Den Země'], ['30. 4.', 'Pálení čarodějnic'], ['1. 6.', 'Den dětí'],
      ['31. 10.', 'Halloween'], ['2. 11.', 'Dušičky'], ['11. 11.', 'Svatý Martin'], ['5. 12.', 'Mikuláš'], ['31. 12.', 'Silvestr']
    ] },
    { id: 'easter', title: 'Lidové dny podle Velikonoc', sub: 'Datum se každý rok mění. Kalendář ho spočítá z Velikonoc.', items: [
      ['−46 dní', 'Popeleční středa'], ['−7 dní', 'Květná neděle'], ['−3 dny', 'Zelený čtvrtek'], ['−1 den', 'Bílá sobota'], ['0 dní', 'Velikonoční neděle']
    ] },
    { id: 'nth', title: 'Lidové dny „n-tá neděle“', sub: 'Potřebují nové pravidlo opakování. Zaškrtni, jestli ho chceš přidat.', items: [
      ['2. ne v 5.', 'Den matek'], ['3. ne v 6.', 'Den otců'], ['4 ne před 24. 12.', 'Adventní neděle (čtyři)']
    ] }
  ];
  var KEY = 'questlog-days-picker', sel = {};
  try { sel = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { sel = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(sel)); } catch (e) {} }
  function id(g, i) { return g.id + ':' + i; }

  var host = document.getElementById('groups');
  host.innerHTML = G.map(function (g) {
    return '<section class="group" data-g="' + g.id + '"><div class="gh"><div class="t"><h2>' + g.title + '</h2><small>' + g.sub + '</small></div>' +
      '<span class="mini"><button type="button" data-all="' + g.id + '">Vše</button><button type="button" data-none="' + g.id + '">Nic</button></span></div>' +
      g.items.map(function (it, i) {
        return '<label class="item"><input type="checkbox" data-id="' + id(g, i) + '"><span class="d">' + it[0] + '</span><span class="n">' + it[1] + (it[2] ? '<small>' + it[2] + '</small>' : '') + '</span></label>';
      }).join('') + '</section>';
  }).join('');

  function paint() {
    host.querySelectorAll('input[type=checkbox]').forEach(function (c) { c.checked = !!sel[c.getAttribute('data-id')]; });
    var total = 0, out = 'Dny do kalendáře (' + '{N}' + ')\n';
    G.forEach(function (g) {
      var lines = [];
      g.items.forEach(function (it, i) { if (sel[id(g, i)]) lines.push('  ' + it[0] + ' ' + it[1]); });
      total += lines.length;
      out += '\n' + g.title.toUpperCase() + ' (' + lines.length + ' z ' + g.items.length + ')\n' + (lines.join('\n') || '  -') + '\n';
    });
    document.getElementById('out').textContent = out.replace('{N}', total);
    document.getElementById('count').textContent = 'Vybráno: ' + total + ' z ' + G.reduce(function (a, g) { return a + g.items.length; }, 0);
  }
  host.addEventListener('change', function (e) {
    var c = e.target.closest('input[type=checkbox]'); if (!c) return;
    if (c.checked) sel[c.getAttribute('data-id')] = 1; else delete sel[c.getAttribute('data-id')];
    save(); paint();
  });
  host.addEventListener('click', function (e) {
    var a = e.target.closest('[data-all],[data-none]'); if (!a) return;
    var gid = a.getAttribute('data-all') || a.getAttribute('data-none'), on = a.hasAttribute('data-all');
    G.forEach(function (g) { if (g.id === gid) g.items.forEach(function (_, i) { if (on) sel[id(g, i)] = 1; else delete sel[id(g, i)]; }); });
    save(); paint();
  });
  document.getElementById('clear').addEventListener('click', function () { sel = {}; save(); paint(); });
  document.getElementById('copy').addEventListener('click', function () {
    var btn = this, txt = document.getElementById('out').textContent;
    function done() { btn.textContent = 'Zkopírováno'; setTimeout(function () { btn.textContent = 'Zkopírovat výběr'; }, 1800); }
    function fallback() { var r = document.createRange(); r.selectNodeContents(document.getElementById('out')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = 'Označeno, zkopíruj ručně'; }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (err) { fallback(); }
  });
  paint();
})();
</script>
